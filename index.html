      0% { transform: scale(0.6) translateY(-12px); opacity: 0; border-radius: 50px; }

    const IconArrowLeft = ({ className = "w-4 h-4 shrink-0" }) => (

    const IconZap = ({ className = "w-4 h-4 shrink-0" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    );

    // --- ALGEBRA MATHEMATICAL ENGINE ---
    function parseLinearEquation(input) {
      if (!input || !input.includes('=')) return null;
      try {
        const clean = input.replace(/\s+/g, '');
        const [leftSide, rightSide] = clean.split('=');
        if (!leftSide || !rightSide) return null;

        let totalA = 0, totalB = 0, totalC = 0;

        const parseSide = (str, multiplier) => {
          const matches = str.match(/([+-]?[^-+]+)/g);
          if (!matches) return;
          for (const term of matches) {
            if (!term) continue;
            if (term.includes('x')) {
              const coeffStr = term.replace('x', '');
              let coeff = 1;
              if (coeffStr === '+' || coeffStr === '') coeff = 1;
              else if (coeffStr === '-') coeff = -1;
              else coeff = parseFloat(coeffStr);
              if (isNaN(coeff)) throw new Error();
              totalA += coeff * multiplier;
            } else if (term.includes('y')) {
              const coeffStr = term.replace('y', '');
              let coeff = 1;
              if (coeffStr === '+' || coeffStr === '') coeff = 1;
              else if (coeffStr === '-') coeff = -1;
              else coeff = parseFloat(coeffStr);
              if (isNaN(coeff)) throw new Error();
              totalB += coeff * multiplier;
            } else {
              const val = parseFloat(term);
              if (isNaN(val)) throw new Error();
              totalC -= val * multiplier;
            }
          }
        };

        parseSide(leftSide, 1);
        parseSide(rightSide, -1);
        if (totalA === 0 && totalB === 0) return null;
        return { a: totalA, b: totalB, c: totalC, raw: input.trim() };
      } catch {
        return null;
      }
    }

    function formatEquationLatex(eq) {
      const { a, b, c } = eq;
      let left = '';
      if (a !== 0) {
        if (a === 1) left += 'x';
        else if (a === -1) left += '-x';
        else left += `${a}x`;
      }
      if (b !== 0) {
        if (left !== '') {
          if (b > 0) left += ` + ${b === 1 ? '' : b}y`;
          else left += ` - ${Math.abs(b) === 1 ? '' : Math.abs(b)}y`;
        } else {
          if (b === 1) left += 'y';
          else if (b === -1) left += '-y';
          else left += `${b}y`;
        }
      }
      if (left === '') left = '0';
      return `${left} = ${c}`;
    }

    function solveSystem(eq1, eq2) {
      const det = eq1.a * eq2.b - eq2.a * eq1.b;
      if (Math.abs(det) < 1e-9) {
        const detX = eq1.c * eq2.b - eq2.c * eq1.b;
        if (Math.abs(detX) < 1e-9) return { x: null, y: null, type: 'infinite' };
        return { x: null, y: null, type: 'none' };
      }
      const rawX = (eq1.c * eq2.b - eq2.c * eq1.b) / det;
      const rawY = (eq1.a * eq2.c - eq2.a * eq1.c) / det;
      const roundX = Math.round(rawX * 1000) / 1000;
      const roundY = Math.round(rawY * 1000) / 1000;
      return {
        x: roundX,
        y: roundY,
        type: 'unique',
        formattedX: Number.isInteger(roundX) ? `${roundX}` : roundX.toFixed(2),
        formattedY: Number.isInteger(roundY) ? `${roundY}` : roundY.toFixed(2),
      };
    }

    function getSlopeIntercept(eq) {
      if (eq.b === 0) return { m: null, b: null, isVertical: true };
      return {
        m: Math.round((-eq.a / eq.b) * 1000) / 1000,
        b: Math.round((eq.c / eq.b) * 1000) / 1000,
        isVertical: false,
      };
    }

    const LESSONS = [
      {
        id: 'eq-basics',

          {

        ],
      },
      {

          },

      {
        id: 'what-is-a-system',
        title: 'What is a System?',
        subtitle: 'Multiple simultaneous conditions',
        category: 'Fundamentals',
        steps: [
          {
            title: 'Two Constraints at Once',
            content: 'A system is a set of equations with shared variables. A valid solution satisfies ALL equations at the exact same moment.',
            latex: '\\begin{cases} 2x + y = 7 \\\\ x - y = 2 \\end{cases}',
          },
          {
            title: 'Testing (3, 1)',
            content: 'Testing (x, y) = (3, 1) in both statements confirms it satisfies both equations.',
            latex: '\\text{Eq 1: } 2(3) + 1 = 7 \\checkmark \\quad \\text{Eq 2: } 3 - 1 = 2 \\checkmark',
          },
        ],
      },
      {
        id: 'substitution-method',
        title: 'Substitution Method',
        subtitle: 'Isolate, substitute, and back-solve',
        category: 'Methods',
        steps: [
          {
            title: 'Step 1: Isolate a Variable',
            content: 'Rearrange one equation so a single variable stands alone on the left side.',
            latex: 'y = 7 - 2x',
          },
          {
            title: 'Step 2: Substitute the Capsule',
            content: 'Plug the isolated expression into the second equation in place of y.',
            latex: 'x - (7 - 2x) = 2',
          },
          {
            title: 'Step 3: Solve & Verify',
            content: 'Solve for x = 3, then plug back to find y = 1.',
            latex: '(x, y) = (3, 1)',
          },
        ],
      },
    ];

    const PRACTICE_PROBLEMS = [
      {
        id: 'p1',
        name: 'Level 1: Direct Substitution',
        eq1: { a: 1, b: 1, c: 7 },
        eq2: { a: 1, b: -1, c: 1 },
      },
      {
        id: 'p2',
        name: 'Level 1: Natural Zero Pair',
        eq1: { a: 2, b: 1, c: 8 },
        eq2: { a: 1, b: -1, c: 1 },
      },
      {
        id: 'p3',
        name: 'Level 2: Pre-isolated Variable',
        eq1: { a: -2, b: 1, c: 1 },
        eq2: { a: 3, b: 1, c: 11 },
      },
    ];

    const KaTeXDisplay = ({ equation, latex, className = '', isBlock = false }) => {
      const containerRef = useRef(null);
      const formula = latex ? latex : equation ? formatEquationLatex(equation) : '';

      useEffect(() => {
        if (containerRef.current) {
          try {
            window.katex.render(formula, containerRef.current, {
              displayMode: isBlock,
              throwOnError: false,
            });
          } catch {
            containerRef.current.innerText = formula;
          }
        }
      }, [formula, isBlock]);

      return <span ref={containerRef} className={`inline-block font-medium ${className}`} />;
    };

    const GraphCanvas = ({ eq1, eq2, solution, width = 380, height = 380 }) => {
      const [range, setRange] = useState(8);

      const toSvgX = (x) => ((x + range) / (2 * range)) * width;
      const toSvgY = (y) => ((range - y) / (2 * range)) * height;

      const ticks = useMemo(() => {
        const list = [];
        for (let i = -range; i <= range; i++) {
          if (i !== 0) list.push(i);
        }
        return list;
      }, [range]);

      const calculateLinePath = (eq) => {
        const { m, b, isVertical } = getSlopeIntercept(eq);
        if (isVertical) {
          const xVal = eq.c / eq.a;
          return `M ${toSvgX(xVal)} 0 L ${toSvgX(xVal)} ${height}`;
        }
        if (m === null || b === null) return '';
        const xLeft = -range;
        const yLeft = m * xLeft + b;
        const xRight = range;
        const yRight = m * xRight + b;
        return `M ${toSvgX(xLeft)} ${toSvgY(yLeft)} L ${toSvgX(xRight)} ${toSvgY(yRight)}`;
      };

      return (
        <div className="flex flex-col items-center bg-white rounded-xl border border-app-border p-4 shadow-sm select-none">
          <div className="flex items-center justify-between w-full mb-3 px-1">
            <span className="text-xs font-bold uppercase tracking-wider text-app-secondary">Coordinate Plane</span>
            <div className="flex items-center gap-1.5">
              <button
                onClick={() => setRange((r) => Math.max(4, r - 2))}
                className="w-7 h-7 flex items-center justify-center rounded-md bg-white hover:bg-app-light text-app-primary border border-app-border text-xs font-bold transition btn-tactile"
                title="Zoom In"
              >
                +
              </button>
              <button
                onClick={() => setRange((r) => Math.min(16, r + 2))}
                className="w-7 h-7 flex items-center justify-center rounded-md bg-white hover:bg-app-light text-app-primary border border-app-border text-xs font-bold transition btn-tactile"
                title="Zoom Out"
              >
                -
              </button>
              <button
                onClick={() => setRange(8)}
                className="px-2.5 h-7 flex items-center justify-center rounded-md bg-white hover:bg-app-light text-app-secondary border border-app-border text-[11px] font-semibold transition btn-tactile"
              >
                Reset
              </button>
            </div>
          </div>

          <div className="relative overflow-hidden rounded-lg border border-app-border bg-[#FCFDFF]">
            <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="block max-w-full h-auto">
              {ticks.map((val) => (
                <g key={`grid-${val}`}>
                  <line x1={toSvgX(val)} y1={0} x2={toSvgX(val)} y2={height} stroke="#E9F0F8" strokeWidth="1" />
                  <line x1={0} y1={toSvgY(val)} x2={width} y2={toSvgY(val)} stroke="#E9F0F8" strokeWidth="1" />
                </g>
              ))}

              <line x1={toSvgX(0)} y1={0} x2={toSvgX(0)} y2={height} stroke="#94A3B8" strokeWidth="2" />
              <line x1={0} y1={toSvgY(0)} x2={width} y2={toSvgY(0)} stroke="#94A3B8" strokeWidth="2" />

              {ticks.map(
                (val) =>
                  val % 2 === 0 && (
                    <g key={`lbl-${val}`}>
                      <text x={toSvgX(val)} y={toSvgY(0) + 14} fontSize="10" fill="#64748B" textAnchor="middle">
                        {val}
                      </text>
                      <text x={toSvgX(0) - 8} y={toSvgY(val) + 4} fontSize="10" fill="#64748B" textAnchor="end">
                        {val}
                      </text>
                    </g>
                  )
              )}

              {eq1 && <path d={calculateLinePath(eq1)} stroke="#4A90E2" strokeWidth="3" strokeLinecap="round" />}
              {eq2 && <path d={calculateLinePath(eq2)} stroke="#E9A23B" strokeWidth="3" strokeLinecap="round" />}

              {solution && solution.type === 'unique' && solution.x !== null && solution.y !== null && (
                <g>
                  <circle cx={toSvgX(solution.x)} cy={toSvgY(solution.y)} r="7" fill="#3BA55D" stroke="#FFFFFF" strokeWidth="2.5" />
                  <rect x={toSvgX(solution.x) + 10} y={toSvgY(solution.y) - 24} width="64" height="22" rx="4" fill="#1F2937" opacity="0.9" />
                  <text x={toSvgX(solution.x) + 42} y={toSvgY(solution.y) - 9} fill="#FFFFFF" fontSize="11" fontWeight="bold" textAnchor="middle">
                    ({solution.formattedX}, {solution.formattedY})
                  </text>
                </g>
              )}
            </svg>
          </div>

          <div className="flex items-center gap-4 mt-3 text-xs text-app-secondary">
            {eq1 && <span className="flex items-center gap-1.5"><span className="w-3 h-1 bg-[#4A90E2] rounded"></span> Eq 1</span>}
            {eq2 && <span className="flex items-center gap-1.5"><span className="w-3 h-1 bg-[#E9A23B] rounded"></span> Eq 2</span>}
            {solution?.type === 'unique' && <span className="flex items-center gap-1.5"><span className="w-2 h-2 bg-app-success rounded-full"></span> Intersection</span>}
          </div>
        </div>
      );
    };

    const SubstitutionCanvas = ({ onCompleted }) => {
      const [step, setStep] = useState(1);
      const [inserted, setInserted] = useState(false);
      const [yAns, setYAns] = useState('');
      const [isSuccess, setIsSuccess] = useState(false);

      return (
        <div className="bg-white rounded-xl border border-app-border p-5 shadow-sm space-y-4">
          <h3 className="text-sm font-bold text-app-dark border-b border-app-border pb-2">Substitution Workspace</h3>
          
          <div className="bg-app-light/60 p-2.5 rounded-lg border border-app-border flex justify-around text-xs">
            <div>Eq 1: <KaTeXDisplay latex="2x + y = 7" className="font-bold" /></div>
            <div>Eq 2: <KaTeXDisplay latex="x - y = 2" className="font-bold" /></div>
          </div>

          <div className="p-3 border border-app-border rounded-lg space-y-2 text-xs">
            <div className="font-bold text-app-primary">Step 1: Isolate y in Eq 1</div>
            <div className="flex justify-between items-center bg-app-light p-2 rounded-md">
              <KaTeXDisplay latex="y = 7 - 2x" className="font-semibold" />
              {step === 1 && (
                <button 
                  onClick={() => setStep(2)} 
                  className="px-3 py-1 btn-primary-gradient text-white text-[11px] font-bold rounded-md btn-tactile flex items-center gap-1"
                >
                  Pack Capsule
                </button>
              )}
            </div>
          </div>

          {step >= 2 && (
            <div className="p-3 border border-app-border rounded-lg space-y-2 text-xs">
              <div className="font-bold text-app-primary">Step 2: Substitute into Eq 2</div>
              <button
                onClick={() => setInserted(true)}
                className={`w-full py-2 border border-app-primary/40 bg-app-light hover:bg-app-soft text-app-primary font-bold text-xs rounded-lg transition btn-tactile ${inserted ? 'opacity-50' : ''}`}
              >
                [ 7 - 2x ] 🍬 Click to Substitute
              </button>
              {inserted && (
                <div className="text-center py-2 bg-app-bg rounded-lg border border-app-border font-bold">
                  <KaTeXDisplay latex="x - (7 - 2x) = 2" />
                  {step === 2 && (
                    <div className="mt-2">
                      <button 
                        onClick={() => setStep(3)} 
                        className="px-3 py-1 btn-primary-gradient text-white text-[11px] font-bold rounded-md btn-tactile"
                      >
                        Solve x & y
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {step >= 3 && (
            <div className="p-3 border border-app-border rounded-lg space-y-2 text-xs">
              <div className="font-bold text-app-primary">Step 3: Solve y</div>
              <p>Since x = 3, substitute x = 3 into y = 7 - 2(3):</p>
              <div className="flex gap-2">
                <input
                  type="number"
                  value={yAns}
                  onChange={(e) => setYAns(e.target.value)}
                  placeholder="y = ?"
                  className="w-20 px-2 py-1 border border-app-border rounded-md text-center text-xs focus:ring-1 focus:ring-app-primary outline-none"
                />
                <button
                  onClick={() => {
                    if (yAns.trim() === '1') {
                      setIsSuccess(true);
                      if (onCompleted) onCompleted();
                    }
                  }}
                  className="px-3 py-1 btn-primary-gradient text-white text-xs font-bold rounded-md btn-tactile"
                >
                  Verify
                </button>
              </div>
              {isSuccess && (
                <div className="p-2 bg-green-50 text-app-success font-bold rounded-md border border-green-200 text-[11px]">
                  ✓ Validated: Solution is (3, 1)
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const EliminationWorkspace = ({ eq1, eq2, onSolved }) => {
      const [m1, setM1] = useState(1);
      const [m2, setM2] = useState(1);
      const [combined, setCombined] = useState(false);
      const [solvedVal, setSolvedVal] = useState('');
      const [isSuccess, setIsSuccess] = useState(false);

      const s1 = { a: eq1.a * m1, b: eq1.b * m1, c: eq1.c * m1 };
      const s2 = { a: eq2.a * m2, b: eq2.b * m2, c: eq2.c * m2 };

      const xCancels = s1.a + s2.a === 0 && s1.a !== 0;
      const yCancels = s1.b + s2.b === 0 && s1.b !== 0;
      const canEliminate = xCancels || yCancels;

      return (
        <div className="bg-white rounded-xl border border-app-border p-5 shadow-sm space-y-4">
          <h3 className="text-sm font-bold text-app-dark border-b border-app-border pb-2">Elimination Workspace</h3>
          
          <div className="space-y-2 text-xs">
            <div className="p-2 bg-app-bg border border-app-border rounded flex justify-between items-center">
              <div>Eq 1: <KaTeXDisplay equation={s1} className="font-bold" /></div>
              <div className="flex items-center gap-1">
                <span>×</span>
                <select value={m1} onChange={(e) => setM1(parseInt(e.target.value))} className="border rounded p-1 text-xs">
                  {[-3,-2,-1,1,2,3,4].map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
            </div>

            <div className="p-2 bg-app-bg border border-app-border rounded flex justify-between items-center">
              <div>Eq 2: <KaTeXDisplay equation={s2} className="font-bold" /></div>
              <div className="flex items-center gap-1">
                <span>×</span>
                <select value={m2} onChange={(e) => setM2(parseInt(e.target.value))} className="border rounded p-1 text-xs">
                  {[-3,-2,-1,1,2,3,4].map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
            </div>
          </div>

          {canEliminate ? (
            <button
              onClick={() => setCombined(true)}
              className="w-full py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-xs rounded-xl transition btn-tactile shadow-sm flex items-center justify-center gap-2"
            >
              <IconSparkles className="w-4 h-4" />
              Combine Equations (Eliminate {xCancels ? 'x' : 'y'})
            </button>
          ) : (
            <div className="p-2.5 text-center text-[11px] text-amber-800 bg-amber-50 rounded-xl border border-amber-200">
              💡 Adjust multipliers so either x or y coefficients become exact opposites.
            </div>
          )}

          {combined && (
            <div className="p-3.5 bg-purple-50/60 rounded-xl border border-purple-100 text-xs space-y-2.5 animate-capsule-morph">
              <div className="font-bold text-purple-700">Combined Result:</div>
              <div className="text-center font-bold text-sm bg-white p-2 rounded-lg border border-purple-100">
                <KaTeXDisplay latex={`${s1.a+s2.a !== 0 ? `${s1.a+s2.a}x` : ''}${s1.b+s2.b !== 0 ? `${s1.b+s2.b > 0 && s1.a+s2.a !== 0 ? ' + ' : ''}${s1.b+s2.b}y` : ''} = ${s1.c+s2.c}`} />
              </div>
              <div className="flex gap-2 pt-1">
                <input
                  type="number"
                  value={solvedVal}
                  onChange={(e) => setSolvedVal(e.target.value)}
                  placeholder="Value..."
                  className="w-24 px-3 py-1.5 border border-purple-200 rounded-lg text-center bg-white text-xs font-bold outline-none"
                />
                <button
                  onClick={() => {
                    const target = (s1.a+s2.a !== 0) ? (s1.c+s2.c)/(s1.a+s2.a) : (s1.c+s2.c)/(s1.b+s2.b);
                    if (parseFloat(solvedVal) === target) {
                      setIsSuccess(true);
                      if (onSolved) onSolved();
                    }
                  }}
                  className="px-4 py-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-bold rounded-lg btn-tactile shadow-sm"
                >
                  Check
                </button>
              </div>
              {isSuccess && (
                <div className="p-2.5 bg-emerald-50 text-emerald-700 font-bold rounded-lg border border-emerald-200 text-xs flex items-center gap-2">
                  <IconCheckCircle className="w-4 h-4 text-emerald-600 shrink-0" />
                  <span>Successfully solved variable! 🌟</span>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [completedLessons, setCompletedLessons] = useState([]);
      const [activeLessonId, setActiveLessonId] = useState(null);
      const [practiceIndex, setPracticeIndex] = useState(0);
      const [practiceMethod, setPracticeMethod] = useState('substitution');
      const [showResetModal, setShowResetModal] = useState(false);

      const [customEq1, setCustomEq1] = useState('2x + 3y = 12');
      const [customEq2, setCustomEq2] = useState('x - y = 1');

      const prob = PRACTICE_PROBLEMS[practiceIndex % PRACTICE_PROBLEMS.length];
      const [activeEq1, setActiveEq1] = useState(prob.eq1);
      const [activeEq2, setActiveEq2] = useState(prob.eq2);
      const [activeSol, setActiveSol] = useState(solveSystem(prob.eq1, prob.eq2));

      const handleCustomSubmit = (e) => {
        e.preventDefault();
        const p1 = parseLinearEquation(customEq1);
        const p2 = parseLinearEquation(customEq2);
        if (p1 && p2) {
          setActiveEq1(p1);
          setActiveEq2(p2);
          setActiveSol(solveSystem(p1, p2));
        }
      };

      const handleLessonCardClick = (lessonId) => {
        setActiveLessonId(lessonId);
      };

      const handleLessonFinished = (lessonId) => {
        if (!completedLessons.includes(lessonId)) {
          setCompletedLessons([...completedLessons, lessonId]);
        }
        setActiveLessonId(null);
      };

      const activeLessonObj = LESSONS.find((l) => l.id === activeLessonId);

      return (
        <div className="min-h-screen bg-[#F8FBFF] flex flex-col font-sans text-app-dark">
          {/* Header & Primary Navigation */}
          <header className="sticky top-0 z-30 bg-white border-b border-app-border/80 shadow-2xs">
            <div className="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
              {/* Brand Logo - Clicking resets to Home */}
              <button 
                onClick={() => { setActiveTab('home'); setActiveLessonId(null); }} 
                className="flex items-center gap-2 text-left group btn-tactile"
                title="Go to Home"
              >
                <div className="w-8 h-8 rounded-lg btn-primary-gradient flex items-center justify-center text-white">
                  <IconCompass className="w-4 h-4" />
                </div>
                <div>
                  <h1 className="text-xs font-bold tracking-tight text-app-dark leading-none group-hover:text-app-primary transition">
                    Algebra Solver Lab
                  </h1>
                  <span className="text-[10px] text-app-secondary uppercase font-semibold tracking-wider">
                    Interactive Learning
                  </span>
                </div>
              </button>

              {/* Main Navigation Bar (With explicit Home Button) */}
              <nav className="flex gap-1 bg-app-light/60 p-1 rounded-xl border border-app-border/60">
                {[
                  { id: 'home', label: 'Home', icon: IconHome },
                  { id: 'learn', label: 'Learn', icon: IconBookOpen },
                  { id: 'practice', label: 'Practice', icon: IconTarget },
                  { id: 'graph', label: 'Graph', icon: IconGrid },
                  { id: 'progress', label: 'Progress', icon: IconTrendingUp },
                ].map(({ id, label, icon: Icon }) => (
                  <button
                    key={id}
                    onClick={() => { setActiveTab(id); setActiveLessonId(null); }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition btn-tactile ${
                      activeTab === id && !activeLessonId
                        ? 'bg-white text-app-primary shadow-2xs font-bold border border-app-border/80' 
                        : 'text-app-secondary hover:text-app-dark hover:bg-white/50'
                    }`}
                  >
                    <Icon className="w-3.5 h-3.5" />
                    <span>{label}</span>
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Breadcrumb Navigation Trail */}
          {activeTab !== 'home' && (
            <div className="bg-white/60 border-b border-app-border/40 py-1.5 px-4">
              <div className="max-w-6xl mx-auto flex items-center gap-2 text-[11px] text-app-secondary font-medium">
                <button 
                  onClick={() => { setActiveTab('home'); setActiveLessonId(null); }} 
                  className="hover:text-app-primary transition flex items-center gap-1 btn-tactile"
                >
                  <IconHome className="w-3 h-3" /> Home
                </button>
                <span>/</span>
                <button 
                  onClick={() => setActiveLessonId(null)} 
                  className={`hover:text-app-primary transition capitalize ${!activeLessonId ? 'font-bold text-app-primary' : ''}`}
                >
                  {activeTab}
                </button>
                {activeLessonId && activeLessonObj && (
                  <>
                    <span>/</span>
                    <span className="font-bold text-app-primary truncate max-w-[150px]">{activeLessonObj.title}</span>
                  </>
                )}
              </div>
            </div>
          )}

          {/* Main Body View */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">
            {/* HOME VIEW */}
            {activeTab === 'home' && (
              <div className="max-w-2xl mx-auto text-center space-y-6 py-6">
                <h2 className="text-3xl font-extrabold text-app-dark">
                  Master Systems of <br />
                  <span className="text-app-primary">Linear Equations</span>
                </h2>
                <p className="text-xs text-app-secondary max-w-md mx-auto">
                  Concept-first interactive lessons, step-by-step substitution & elimination solvers, and coordinate graphing.
                </p>
                <div className="flex justify-center gap-3">
                  <button
                    onClick={() => setActiveTab('learn')}
                    className="px-5 py-2.5 btn-primary-gradient text-white text-xs font-bold rounded-xl shadow transition inline-flex items-center gap-2 btn-tactile"
                  >
                    <IconBookOpen className="w-4 h-4" /> Start Curriculum
                  </button>
                  <button
                    onClick={() => setActiveTab('practice')}
                    className="px-5 py-2.5 bg-white hover:bg-app-light border border-app-border text-app-dark text-xs font-bold rounded-xl shadow-2xs transition inline-flex items-center gap-2 btn-tactile"
                  >
                    <IconTarget className="w-4 h-4 text-app-primary" /> Practice Solvers
                  </button>
                </div>

                {/* Home Progress & Quick Links Card */}
                <div className="bg-white p-5 rounded-xl border border-app-border shadow-sm text-left space-y-3">
                  <div className="flex justify-between text-xs font-bold">
                    <span className="text-app-secondary">Curriculum Progress</span>
                    <span className="text-app-primary">{completedLessons.length} / {LESSONS.length} Finished</span>
                  </div>
                  <div className="w-full bg-app-bg h-2 rounded-full overflow-hidden border border-app-border">
                    <div className="bg-app-primary h-full transition-all" style={{ width: `${(completedLessons.length / LESSONS.length)*100}%` }} />
                  </div>
                  
                  {/* Shortcut Navigation Grid */}
                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <button 
                      onClick={() => setActiveTab('learn')} 
                      className="p-3 border border-app-border rounded-xl hover:bg-app-light text-left text-xs transition btn-tactile hover:border-app-primary/40 shadow-2xs flex items-center justify-between"
                    >
                      <div>
                        <div className="font-bold text-app-dark">Curriculum Lessons</div>
                        <div className="text-[10px] text-app-secondary">Structured Learning</div>
                      </div>
                      <IconBookOpen className="w-4 h-4 text-app-primary shrink-0" />
                    </button>
                    <button 
                      onClick={() => setActiveTab('practice')} 
                      className="p-3 border border-app-border rounded-xl hover:bg-app-light text-left text-xs transition btn-tactile hover:border-app-primary/40 shadow-2xs flex items-center justify-between"
                    >
                      <div>
                        <div className="font-bold text-app-dark">Guided Practice</div>
                        <div className="text-[10px] text-app-secondary">Interactive Solvers</div>
                      </div>
                      <IconTarget className="w-4 h-4 text-app-primary shrink-0" />
                    </button>
                    <button 
                      onClick={() => setActiveTab('graph')} 
                      className="p-3 border border-app-border rounded-xl hover:bg-app-light text-left text-xs transition btn-tactile hover:border-app-primary/40 shadow-2xs flex items-center justify-between"
                    >
                      <div>
                        <div className="font-bold text-app-dark">Graph Explorer</div>
                        <div className="text-[10px] text-app-secondary">Coordinate Plane</div>
                      </div>
                      <IconGrid className="w-4 h-4 text-app-primary shrink-0" />
                    </button>
                    <button 
                      onClick={() => setActiveTab('progress')} 
                      className="p-3 border border-app-border rounded-xl hover:bg-app-light text-left text-xs transition btn-tactile hover:border-app-primary/40 shadow-2xs flex items-center justify-between"
                    >
                      <div>
                        <div className="font-bold text-app-dark">My Progress</div>
                        <div className="text-[10px] text-app-secondary">Mastery Dashboard</div>
                      </div>
                      <IconTrendingUp className="w-4 h-4 text-app-primary shrink-0" />
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* LEARN VIEW */}
            {activeTab === 'learn' && (
              <>
                {activeLessonId && activeLessonObj ? (
                  <LessonViewer
                    lesson={activeLessonObj}
                    onComplete={handleLessonFinished}
                    onBack={() => setActiveLessonId(null)}
                  />
                ) : (
                  <div className="max-w-2xl mx-auto space-y-4">
                    <div className="border-b border-app-border pb-2 flex justify-between items-center">
                      <h2 className="text-xs font-bold uppercase tracking-wider text-app-primary">Structured Curriculum</h2>
                      <span className="text-xs text-app-secondary">{completedLessons.length}/{LESSONS.length} Done</span>
                    </div>
                    <div className="space-y-2">
                      {LESSONS.map((ls, idx) => {
                        const isDone = completedLessons.includes(ls.id);
                        return (
                          <div
                            key={ls.id}
                            onClick={() => handleLessonCardClick(ls.id)}
                            className="p-3 rounded-xl border border-app-border bg-white hover:bg-app-light cursor-pointer transition flex justify-between items-center shadow-2xs btn-tactile"
                          >
                            <div className="flex items-center gap-3">
                              <span className="w-6 h-6 rounded-lg bg-app-light text-app-primary font-bold text-xs flex items-center justify-center shrink-0">
                                {idx + 1}
                              </span>
                              <div>
                                <h3 className="text-xs font-bold text-app-dark">{ls.title}</h3>
                                <p className="text-[10px] text-app-secondary">{ls.subtitle}</p>
                              </div>
                            </div>
                            <div className="w-7 h-7 flex items-center justify-center rounded-lg border border-app-border bg-app-bg text-app-secondary shrink-0">
                              {isDone ? (
                                <IconCheckCircle className="text-app-success w-3.5 h-3.5 shrink-0" />
                              ) : (
                                <IconArrowRight className="text-app-secondary w-3.5 h-3.5 shrink-0" />
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </>
            )}

            {/* PRACTICE VIEW */}
            {activeTab === 'practice' && (
              <div className="max-w-5xl mx-auto space-y-6">
                <div className="flex justify-between items-center bg-white p-2.5 rounded-xl border border-app-border shadow-2xs">
                  <div>
                    <span className="text-[10px] uppercase font-bold text-app-primary tracking-wider">Practice System</span>
                    <h3 className="text-xs font-bold">{prob.name}</h3>
                  </div>
                  <div className="flex gap-1.5 bg-app-bg p-1 rounded-lg border border-app-border/60">
                    <button
                      onClick={() => setPracticeMethod('substitution')}
                      className={`px-3 py-1 rounded-md text-xs font-bold transition btn-tactile ${
                        practiceMethod === 'substitution' 
                          ? 'bg-white text-app-primary shadow-2xs border border-app-border/80' 
                          : 'text-app-secondary hover:text-app-dark'
                      }`}
                    >
                      Substitution
                    </button>
                    <button
                      onClick={() => setPracticeMethod('elimination')}
                      className={`px-3 py-1 rounded-md text-xs font-bold transition btn-tactile ${
                        practiceMethod === 'elimination' 
                          ? 'bg-white text-app-primary shadow-2xs border border-app-border/80' 
                          : 'text-app-secondary hover:text-app-dark'
                      }`}
                    >
                      Elimination
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    {practiceMethod === 'substitution' ? (
                      <SubstitutionCanvas />
                    ) : (
                      <EliminationWorkspace eq1={activeEq1} eq2={activeEq2} />
                    )}
                  </div>
                  <div className="flex justify-center">
                    <GraphCanvas eq1={activeEq1} eq2={activeEq2} solution={activeSol} />
                  </div>
                </div>

                {/* Custom System Builder */}
                <form onSubmit={handleCustomSubmit} className="bg-white p-4 rounded-xl border border-app-border space-y-3">
                  <div className="text-xs font-bold text-app-dark">Custom Equation Input</div>
                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <input
                      type="text"
                      value={customEq1}
                      onChange={(e) => setCustomEq1(e.target.value)}
                      className="p-2 border border-app-border rounded focus:ring-1 focus:ring-app-primary outline-none"
                      placeholder="e.g. 2x + 3y = 12"
                    />
                    <input
                      type="text"
                      value={customEq2}
                      onChange={(e) => setCustomEq2(e.target.value)}
                      className="p-2 border border-app-border rounded focus:ring-1 focus:ring-app-primary outline-none"
                      placeholder="e.g. x - y = 1"
                    />
                  </div>
                  <div className="text-right">
                    <button type="submit" className="px-4 py-1.5 btn-primary-gradient text-white font-bold text-xs rounded-lg btn-tactile">
                      Solve Custom
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* GRAPH VIEW */}
            {activeTab === 'graph' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                  <GraphCanvas eq1={activeEq1} eq2={activeEq2} solution={activeSol} />
                  <div className="bg-white p-5 rounded-xl border border-app-border space-y-3 text-xs">
                    <h3 className="font-bold text-app-dark border-b border-app-border pb-2">Active Representation</h3>
                    <div className="flex justify-between">
                      <span>Line 1:</span>
                      <KaTeXDisplay equation={activeEq1} className="font-bold text-[#4A90E2]" />
                    </div>
                    <div className="flex justify-between">
                      <span>Line 2:</span>
                      <KaTeXDisplay equation={activeEq2} className="font-bold text-[#E9A23B]" />
                    </div>
                    <div className="pt-2 border-t border-app-border text-app-secondary">
                      {activeSol.type === 'unique' && (
                        <span>Intersects at ({activeSol.formattedX}, {activeSol.formattedY})</span>
                      )}
                      {activeSol.type === 'none' && <span className="text-app-error font-bold">Parallel lines (No Solution)</span>}
                      {activeSol.type === 'infinite' && <span className="text-app-warning font-bold">Identical lines (Infinite Solutions)</span>}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* PROGRESS VIEW */}
            {activeTab === 'progress' && (
              <div className="max-w-2xl mx-auto space-y-4">
                <div className="bg-white p-5 rounded-xl border border-app-border space-y-3 text-xs">
                  <h3 className="font-bold text-app-dark text-sm">Learning Progress</h3>
                  <div className="flex justify-between py-1 border-b border-app-border">
                    <span>Lessons Completed:</span>
                    <span className="font-bold">{completedLessons.length} / {LESSONS.length}</span>
                  </div>
                  <div className="text-right pt-2">
                    <button
                      onClick={() => setShowResetModal(true)}
                      className="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-app-error font-bold rounded-lg border border-red-200 text-xs transition btn-tactile"
                    >
                      Reset Progress
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Confirmation Modal */}
          {showResetModal && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl p-5 max-w-sm w-full space-y-4 text-xs shadow-lg border border-app-border">
                <h4 className="text-sm font-bold text-app-dark">Reset Progress?</h4>
                <p className="text-app-secondary">This will clear all completed lesson tracking. Proceed?</p>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowResetModal(false)} className="px-3 py-1.5 border border-app-border hover:bg-slate-50 rounded-lg font-bold btn-tactile">Cancel</button>
                  <button
                    onClick={() => {
                      setCompletedLessons([]);
                      setShowResetModal(false);
                    }}
                    className="px-3.5 py-1.5 bg-app-error hover:bg-red-600 text-white font-bold rounded-lg btn-tactile shadow-2xs"
                  >
                    Reset
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-app-border bg-white py-3 text-center text-xs text-app-secondary">
            Algebra Solver Lab — Single-File Application
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
